services:
  # ── API Server (Express) ────────────────────────────────────────────────────
  - type: web
    name: anime-morph-api
    runtime: node
    region: oregon
    plan: free
    # Full build: compiles BOTH the API and the React frontend. The API serves
    # the frontend's static build in production, so a single service answers
    # `/api/*` and the SPA.
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
  # Single service only: the API above serves the React frontend in production,
  # so no separate static site is needed. The frontend calls the API at the
  # same origin via relative `/api/...` paths (no VITE_API_BASE_URL required).
